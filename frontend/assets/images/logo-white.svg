<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 75" width="340" height="75" fill="none">
  <!-- Sunburst Gear Emblem -->
  <g transform="translate(38, 38)">
    <!-- Sun rays -->
    <g stroke="#f5a623" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-32" x2="0" y2="-24" />
      <line x1="12" y1="-30" x2="9" y2="-22" />
      <line x1="22" y1="-22" x2="16" y2="-16" />
      <line x1="30" y1="-12" x2="22" y2="-9" />
      <line x1="32" y1="0" x2="24" y2="0" />
      <line x1="30" y1="12" x2="22" y2="9" />
      <line x1="22" y1="22" x2="16" y2="16" />
      <line x1="12" y1="30" x2="9" y2="22" />
      <line x1="0" y1="32" x2="0" y2="24" />
      <line x1="-12" y1="30" x2="-9" y2="22" />
      <line x1="-22" y1="22" x2="-16" y2="16" />
      <line x1="-30" y1="12" x2="-22" y2="9" />
      <line x1="-32" y1="0" x2="-24" y2="0" />
      <line x1="-30" y1="-12" x2="-22" y2="-9" />
      <line x1="-22" y1="-22" x2="-16" y2="-16" />
      <line x1="-12" y1="-30" x2="-9" y2="-22" />
    </g>
    <!-- Gear ring -->
    <circle cx="0" cy="0" r="19" stroke="#f5a623" stroke-width="2" fill="#1c2026" />
    <circle cx="0" cy="0" r="15" fill="#f5a623" opacity="0.25" />
    <!-- Stylized S Monogram in center -->
    <path d="M-4 -8 C -1 -12, 6 -11, 6 -6 C 6 -1, -5 0, -5 6 C -5 11, 2 12, 6 9" stroke="#f5a623" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="0" cy="0" r="2" fill="#f5a623" />
  </g>

  <!-- Typography -->
  <text x="84" y="44" font-family="'Instrument Sans', 'Hind', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Sunrise</text>
  <text x="195" y="44" font-family="'Instrument Sans', 'Hind', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="600" fill="#f5a623" letter-spacing="-0.5">Industries</text>
  <text x="86" y="58" font-family="'Hind', -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#9da3af" letter-spacing="2">RAW TO READY ALL HERE</text>
</svg>
